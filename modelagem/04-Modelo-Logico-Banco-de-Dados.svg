<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="100%" height="100%" style="background-color: #1e1e2e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#313244" />
      <stop offset="100%" stop-color="#45475a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="rel-start" markerWidth="8" markerHeight="8" refX="4" refY="4">
      <circle cx="4" cy="4" r="2.5" fill="#89b4fa" stroke="#1e1e2e" stroke-width="1"/>
    </marker>
    <marker id="rel-end" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9" fill="none" stroke="#89b4fa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .table-card { fill: #181825; stroke: #313244; stroke-width: 1.5; rx: 8px; filter: url(#shadow); }
    .table-header { fill: #313244; rx: 8px; }
    .table-title { fill: #cdd6f4; font-size: 14px; font-weight: 700; letter-spacing: 0.5px; }
    .col-name { fill: #cdd6f4; font-size: 12px; font-family: 'SF Mono', 'Fira Code', Menlo, monospace; }
    .col-type { fill: #a6adc8; font-size: 11px; font-family: 'SF Mono', 'Fira Code', Menlo, monospace; }
    .pk-badge { fill: #f38ba8; font-size: 9px; font-weight: bold; font-family: 'SF Mono', monospace; }
    .fk-badge { fill: #89b4fa; font-size: 9px; font-weight: bold; font-family: 'SF Mono', monospace; }
    .uk-badge { fill: #f9e2af; font-size: 9px; font-weight: bold; font-family: 'SF Mono', monospace; }
    .row-even { fill: #1e1e2e; }
    .row-odd { fill: #181825; }
    .rel-line { fill: none; stroke: #89b4fa; stroke-width: 1.8; stroke-dasharray: 4, 4; opacity: 0.75; }
    .rel-line-solid { fill: none; stroke: #89b4fa; stroke-width: 1.8; opacity: 0.85; }
    .group-title { fill: #9399b2; font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }
  </style>

  <!-- Title & Watermark -->
  <text x="50" y="45" fill="#cdd6f4" font-size="24" font-weight="800">Classdoor — Modelo Lógico Relacional (PostgreSQL)</text>
  <text x="50" y="70" fill="#6c7086" font-size="13">Gerado via especificação DBML (dbdiagram.io) • Arquitetura de Dados v1.1.0</text>

  <!-- RELATIONSHIPS PATHS -->
  <!-- users -> students (1:1) -->
  <path d="M 320 180 H 420" class="rel-line-solid" marker-start="url(#rel-start)" marker-end="url(#rel-end)" />
  <!-- users -> professors (1:1) -->
  <path d="M 320 230 H 370 V 380 H 420" class="rel-line-solid" marker-start="url(#rel-start)" marker-end="url(#rel-end)" />
  <!-- departments -> students (1:N) -->
  <path d="M 550 110 V 130" class="rel-line" marker-start="url(#rel-start)" marker-end="url(#rel-end)" />
  <!-- departments -> professors (1:N) -->
  <path d="M 690 90 H 740 V 390 H 700" class="rel-line" marker-start="url(#rel-start)" marker-end="url(#rel-end)" />
  <!-- departments -> courses (1:N) -->
  <path d="M 690 60 H 800" class="rel-line" marker-start="url(#rel-start)" marker-end="url(#rel-end)" />
  <!-- courses -> classes (1:N) -->
  <path d="M 930 200 V 270" class="rel-line" marker-start="url(#rel-start)" marker-end="url(#rel-end)" />
  <!-- professors -> classes (1:N) -->
  <path d="M 700 450 H 760 V 350 H 820" class="rel-line" marker-start="url(#rel-start)" marker-end="url(#rel-end)" />
  <!-- classes -> evaluation_policies (1:1) -->
  <path d="M 1080 340 H 1150" class="rel-line-solid" marker-start="url(#rel-start)" marker-end="url(#rel-end)" />
  <!-- professors -> reviews (1:N) -->
  <path d="M 560 620 V 680" class="rel-line" marker-start="url(#rel-start)" marker-end="url(#rel-end)" />
  <!-- classes -> reviews (1:N) -->
  <path d="M 950 460 V 680" class="rel-line" marker-start="url(#rel-start)" marker-end="url(#rel-end)" />
  <!-- reviews -> review_tags (1:N) -->
  <path d="M 960 850 H 1050" class="rel-line" marker-start="url(#rel-start)" marker-end="url(#rel-end)" />
  <!-- tags -> review_tags (1:N) -->
  <path d="M 1340 760 H 1280 V 850 H 1260" class="rel-line" marker-start="url(#rel-start)" marker-end="url(#rel-end)" />
  <!-- reviews -> review_upvotes (1:N) -->
  <path d="M 680 920 V 960 H 520" class="rel-line" marker-start="url(#rel-start)" marker-end="url(#rel-end)" />
  <!-- users -> review_upvotes (1:N) -->
  <path d="M 190 390 V 990 H 260" class="rel-line" marker-start="url(#rel-start)" marker-end="url(#rel-end)" />

  <!-- TABLE: users -->
  <g transform="translate(60, 110)">
    <rect width="260" height="280" class="table-card" />
    <path d="M 0 0 h 260 v 35 h -260 Z" class="table-header" fill="#f38ba8" />
    <text x="15" y="23" class="table-title">👤 users</text>
    <rect x="0" y="35" width="260" height="30" class="row-even" />
    <text x="15" y="55" class="col-name">id</text><text x="120" y="55" class="col-type">uuid</text><text x="220" y="55" class="pk-badge">[PK]</text>
    <rect x="0" y="65" width="260" height="30" class="row-odd" />
    <text x="15" y="85" class="col-name">email</text><text x="120" y="85" class="col-type">varchar(255)</text><text x="220" y="85" class="uk-badge">[UK]</text>
    <rect x="0" y="95" width="260" height="30" class="row-even" />
    <text x="15" y="115" class="col-name">password_hash</text><text x="120" y="115" class="col-type">varchar(255)</text>
    <rect x="0" y="125" width="260" height="30" class="row-odd" />
    <text x="15" y="145" class="col-name">name</text><text x="120" y="145" class="col-type">varchar(150)</text>
    <rect x="0" y="155" width="260" height="30" class="row-even" />
    <text x="15" y="175" class="col-name">role</text><text x="120" y="175" class="col-type">user_role_enum</text>
    <rect x="0" y="185" width="260" height="30" class="row-odd" />
    <text x="15" y="205" class="col-name">is_active</text><text x="120" y="205" class="col-type">boolean</text>
    <rect x="0" y="215" width="260" height="30" class="row-even" />
    <text x="15" y="235" class="col-name">created_at</text><text x="120" y="235" class="col-type">timestamptz</text>
    <rect x="0" y="245" width="260" height="30" class="row-odd" />
    <text x="15" y="265" class="col-name">updated_at</text><text x="120" y="265" class="col-type">timestamptz</text>
  </g>

  <!-- TABLE: departments -->
  <g transform="translate(430, 20)">
    <rect width="260" height="160" class="table-card" />
    <path d="M 0 0 h 260 v 35 h -260 Z" class="table-header" />
    <text x="15" y="23" class="table-title">🏛️ departments</text>
    <rect x="0" y="35" width="260" height="30" class="row-even" />
    <text x="15" y="55" class="col-name">id</text><text x="120" y="55" class="col-type">uuid</text><text x="220" y="55" class="pk-badge">[PK]</text>
    <rect x="0" y="65" width="260" height="30" class="row-odd" />
    <text x="15" y="85" class="col-name">code</text><text x="120" y="85" class="col-type">varchar(20)</text><text x="220" y="85" class="uk-badge">[UK]</text>
    <rect x="0" y="95" width="260" height="30" class="row-even" />
    <text x="15" y="115" class="col-name">name</text><text x="120" y="115" class="col-type">varchar(150)</text>
    <rect x="0" y="125" width="260" height="30" class="row-odd" />
    <text x="15" y="145" class="col-name">website_url</text><text x="120" y="145" class="col-type">varchar(255)</text>
  </g>

  <!-- TABLE: students -->
  <g transform="translate(420, 200)">
    <rect width="280" height="130" class="table-card" />
    <path d="M 0 0 h 280 v 35 h -280 Z" class="table-header" />
    <text x="15" y="23" class="table-title">🎓 students</text>
    <rect x="0" y="35" width="280" height="30" class="row-even" />
    <text x="15" y="55" class="col-name">id</text><text x="130" y="55" class="col-type">uuid</text><text x="215" y="55" class="pk-badge">[PK, FK]</text>
    <rect x="0" y="65" width="280" height="30" class="row-odd" />
    <text x="15" y="85" class="col-name">registration_number</text><text x="130" y="85" class="col-type">varchar(50)</text><text x="235" y="85" class="uk-badge">[UK]</text>
    <rect x="0" y="95" width="280" height="30" class="row-even" />
    <text x="15" y="115" class="col-name">department_id</text><text x="130" y="115" class="col-type">uuid</text><text x="235" y="115" class="fk-badge">[FK]</text>
  </g>

  <!-- TABLE: professors -->
  <g transform="translate(420, 360)">
    <rect width="280" height="280" class="table-card" />
    <path d="M 0 0 h 280 v 35 h -280 Z" class="table-header" />
    <text x="15" y="23" class="table-title">👨‍🏫 professors</text>
    <rect x="0" y="35" width="280" height="30" class="row-even" />
    <text x="15" y="55" class="col-name">id</text><text x="130" y="55" class="col-type">uuid</text><text x="215" y="55" class="pk-badge">[PK, FK]</text>
    <rect x="0" y="65" width="280" height="30" class="row-odd" />
    <text x="15" y="85" class="col-name">department_id</text><text x="130" y="85" class="col-type">uuid</text><text x="235" y="85" class="fk-badge">[FK]</text>
    <rect x="0" y="95" width="280" height="30" class="row-even" />
    <text x="15" y="115" class="col-name">title</text><text x="130" y="115" class="col-type">varchar(50)</text>
    <rect x="0" y="125" width="280" height="30" class="row-odd" />
    <text x="15" y="145" class="col-name">bio</text><text x="130" y="145" class="col-type">text</text>
    <rect x="0" y="155" width="280" height="30" class="row-even" />
    <text x="15" y="175" class="col-name">average_rating</text><text x="130" y="175" class="col-type">numeric(3,2)</text>
    <rect x="0" y="185" width="280" height="30" class="row-odd" />
    <text x="15" y="205" class="col-name">difficulty_rating</text><text x="130" y="205" class="col-type">numeric(3,2)</text>
    <rect x="0" y="215" width="280" height="30" class="row-even" />
    <text x="15" y="235" class="col-name">recommendation_rate</text><text x="130" y="235" class="col-type">numeric(5,2)</text>
    <rect x="0" y="245" width="280" height="30" class="row-odd" />
    <text x="15" y="265" class="col-name">total_reviews</text><text x="130" y="265" class="col-type">int</text>
  </g>

  <!-- TABLE: courses -->
  <g transform="translate(800, 20)">
    <rect width="270" height="220" class="table-card" />
    <path d="M 0 0 h 270 v 35 h -270 Z" class="table-header" />
    <text x="15" y="23" class="table-title">📚 courses</text>
    <rect x="0" y="35" width="270" height="30" class="row-even" />
    <text x="15" y="55" class="col-name">id</text><text x="120" y="55" class="col-type">uuid</text><text x="225" y="55" class="pk-badge">[PK]</text>
    <rect x="0" y="65" width="270" height="30" class="row-odd" />
    <text x="15" y="85" class="col-name">department_id</text><text x="120" y="85" class="col-type">uuid</text><text x="225" y="85" class="fk-badge">[FK]</text>
    <rect x="0" y="95" width="270" height="30" class="row-even" />
    <text x="15" y="115" class="col-name">code</text><text x="120" y="115" class="col-type">varchar(30)</text><text x="225" y="115" class="uk-badge">[UK]</text>
    <rect x="0" y="125" width="270" height="30" class="row-odd" />
    <text x="15" y="145" class="col-name">name</text><text x="120" y="145" class="col-type">varchar(150)</text>
    <rect x="0" y="155" width="270" height="30" class="row-even" />
    <text x="15" y="175" class="col-name">description</text><text x="120" y="175" class="col-type">text</text>
    <rect x="0" y="185" width="270" height="30" class="row-odd" />
    <text x="15" y="205" class="col-name">credits</text><text x="120" y="205" class="col-type">int</text>
  </g>

  <!-- TABLE: classes -->
  <g transform="translate(820, 270)">
    <rect width="260" height="220" class="table-card" />
    <path d="M 0 0 h 260 v 35 h -260 Z" class="table-header" />
    <text x="15" y="23" class="table-title">🏫 classes</text>
    <rect x="0" y="35" width="260" height="30" class="row-even" />
    <text x="15" y="55" class="col-name">id</text><text x="120" y="55" class="col-type">uuid</text><text x="220" y="55" class="pk-badge">[PK]</text>
    <rect x="0" y="65" width="260" height="30" class="row-odd" />
    <text x="15" y="85" class="col-name">course_id</text><text x="120" y="85" class="col-type">uuid</text><text x="220" y="85" class="fk-badge">[FK]</text>
    <rect x="0" y="95" width="260" height="30" class="row-even" />
    <text x="15" y="115" class="col-name">professor_id</text><text x="120" y="115" class="col-type">uuid</text><text x="220" y="115" class="fk-badge">[FK]</text>
    <rect x="0" y="125" width="260" height="30" class="row-odd" />
    <text x="15" y="145" class="col-name">semester</text><text x="120" y="145" class="col-type">varchar(20)</text>
    <rect x="0" y="155" width="260" height="30" class="row-even" />
    <text x="15" y="175" class="col-name">code</text><text x="120" y="175" class="col-type">varchar(20)</text>
    <rect x="0" y="185" width="260" height="30" class="row-odd" />
    <text x="15" y="205" class="col-name">is_active</text><text x="120" y="205" class="col-type">boolean</text>
  </g>

  <!-- TABLE: evaluation_policies -->
  <g transform="translate(1150, 270)">
    <rect width="280" height="160" class="table-card" />
    <path d="M 0 0 h 280 v 35 h -280 Z" class="table-header" />
    <text x="15" y="23" class="table-title">🛡️ evaluation_policies</text>
    <rect x="0" y="35" width="280" height="30" class="row-even" />
    <text x="15" y="55" class="col-name">id</text><text x="120" y="55" class="col-type">uuid</text><text x="235" y="55" class="pk-badge">[PK]</text>
    <rect x="0" y="65" width="280" height="30" class="row-odd" />
    <text x="15" y="85" class="col-name">class_id</text><text x="120" y="85" class="col-type">uuid</text><text x="215" y="85" class="fk-badge">[UK, FK]</text>
    <rect x="0" y="95" width="280" height="30" class="row-even" />
    <text x="15" y="115" class="col-name">mode</text><text x="120" y="115" class="col-type">eval_mode_enum</text>
    <rect x="0" y="125" width="280" height="30" class="row-odd" />
    <text x="15" y="145" class="col-name">updated_at</text><text x="120" y="145" class="col-type">timestamptz</text>
  </g>

  <!-- TABLE: reviews -->
  <g transform="translate(540, 680)">
    <rect width="420" height="390" class="table-card" />
    <path d="M 0 0 h 420 v 35 h -420 Z" class="table-header" fill="#a6e3a1" />
    <text x="15" y="23" class="table-title" fill="#1e1e2e">📝 reviews</text>
    <rect x="0" y="35" width="420" height="30" class="row-even" />
    <text x="15" y="55" class="col-name">id</text><text x="180" y="55" class="col-type">uuid</text><text x="375" y="55" class="pk-badge">[PK]</text>
    <rect x="0" y="65" width="420" height="30" class="row-odd" />
    <text x="15" y="85" class="col-name">professor_id</text><text x="180" y="85" class="col-type">uuid</text><text x="375" y="85" class="fk-badge">[FK]</text>
    <rect x="0" y="95" width="420" height="30" class="row-even" />
    <text x="15" y="115" class="col-name">class_id</text><text x="180" y="115" class="col-type">uuid</text><text x="375" y="115" class="fk-badge">[FK]</text>
    <rect x="0" y="125" width="420" height="30" class="row-odd" />
    <text x="15" y="145" class="col-name">rating</text><text x="180" y="145" class="col-type">smallint (1..5)</text>
    <rect x="0" y="155" width="420" height="30" class="row-even" />
    <text x="15" y="175" class="col-name">difficulty</text><text x="180" y="175" class="col-type">smallint (1..5)</text>
    <rect x="0" y="185" width="420" height="30" class="row-odd" />
    <text x="15" y="205" class="col-name">would_recommend</text><text x="180" y="205" class="col-type">boolean</text>
    <rect x="0" y="215" width="420" height="30" class="row-even" />
    <text x="15" y="235" class="col-name">comment</text><text x="180" y="235" class="col-type">text</text>
    <rect x="0" y="245" width="420" height="30" class="row-odd" />
    <text x="15" y="265" class="col-name">is_anonymous</text><text x="180" y="265" class="col-type">boolean (default true)</text>
    <rect x="0" y="275" width="420" height="30" class="row-even" />
    <text x="15" y="295" class="col-name">student_identifier_display</text><text x="180" y="295" class="col-type">varchar(150)</text>
    <rect x="0" y="305" width="420" height="30" class="row-odd" />
    <text x="15" y="325" class="col-name">audit_hash</text><text x="180" y="325" class="col-type">varchar(64)</text><text x="375" y="325" class="uk-badge">[UK]</text>
    <rect x="0" y="335" width="420" height="30" class="row-even" />
    <text x="15" y="355" class="col-name">upvotes_count</text><text x="180" y="355" class="col-type">int (default 0)</text>
    <rect x="0" y="365" width="420" height="30" class="row-odd" />
    <text x="15" y="385" class="col-name">created_at</text><text x="180" y="385" class="col-type">timestamptz</text>
  </g>

  <!-- TABLE: review_tags -->
  <g transform="translate(1050, 800)">
    <rect width="210" height="100" class="table-card" />
    <path d="M 0 0 h 210 v 35 h -210 Z" class="table-header" />
    <text x="15" y="23" class="table-title">🏷️ review_tags</text>
    <rect x="0" y="35" width="210" height="30" class="row-even" />
    <text x="15" y="55" class="col-name">review_id</text><text x="100" y="55" class="col-type">uuid</text><text x="150" y="55" class="pk-badge">[PK, FK]</text>
    <rect x="0" y="65" width="210" height="30" class="row-odd" />
    <text x="15" y="85" class="col-name">tag_id</text><text x="100" y="85" class="col-type">uuid</text><text x="150" y="85" class="pk-badge">[PK, FK]</text>
  </g>

  <!-- TABLE: tags -->
  <g transform="translate(1340, 680)">
    <rect width="240" height="160" class="table-card" />
    <path d="M 0 0 h 240 v 35 h -240 Z" class="table-header" />
    <text x="15" y="23" class="table-title">🏷️ tags</text>
    <rect x="0" y="35" width="240" height="30" class="row-even" />
    <text x="15" y="55" class="col-name">id</text><text x="100" y="55" class="col-type">uuid</text><text x="190" y="55" class="pk-badge">[PK]</text>
    <rect x="0" y="65" width="240" height="30" class="row-odd" />
    <text x="15" y="85" class="col-name">name</text><text x="100" y="85" class="col-type">varchar(50)</text><text x="190" y="85" class="uk-badge">[UK]</text>
    <rect x="0" y="95" width="240" height="30" class="row-even" />
    <text x="15" y="115" class="col-name">category</text><text x="100" y="115" class="col-type">varchar(30)</text>
    <rect x="0" y="125" width="240" height="30" class="row-odd" />
    <text x="15" y="145" class="col-name">icon_class</text><text x="100" y="145" class="col-type">varchar(50)</text>
  </g>

  <!-- TABLE: review_upvotes -->
  <g transform="translate(260, 930)">
    <rect width="260" height="160" class="table-card" />
    <path d="M 0 0 h 260 v 35 h -260 Z" class="table-header" />
    <text x="15" y="23" class="table-title">👍 review_upvotes</text>
    <rect x="0" y="35" width="260" height="30" class="row-even" />
    <text x="15" y="55" class="col-name">id</text><text x="120" y="55" class="col-type">uuid</text><text x="215" y="55" class="pk-badge">[PK]</text>
    <rect x="0" y="65" width="260" height="30" class="row-odd" />
    <text x="15" y="85" class="col-name">review_id</text><text x="120" y="85" class="col-type">uuid</text><text x="215" y="85" class="fk-badge">[FK]</text>
    <rect x="0" y="95" width="260" height="30" class="row-even" />
    <text x="15" y="115" class="col-name">user_id</text><text x="120" y="115" class="col-type">uuid</text><text x="215" y="115" class="fk-badge">[FK]</text>
    <rect x="0" y="125" width="260" height="30" class="row-odd" />
    <text x="15" y="145" class="col-name">created_at</text><text x="120" y="145" class="col-type">timestamptz</text>
  </g>
</svg>